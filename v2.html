<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>湾区之行 · 9/25–10/10</title>
<style>
:root{--bg:#f6f3ec;--card:#ffffff;--ink:#232323;--muted:#8b8578;--line:#e9e2d4;
--accent:#e0641a;--accent-soft:#fdeee2;--green:#177a5b;--green-soft:#e2f2ea;
--amber:#a05a08;--amber-soft:#fdf3e0;--gray:#6b7280;--gray-soft:#f0efe9;
--red:#b3401f;--red-soft:#fdeae4;--shadow:0 2px 14px rgba(60,45,20,.07);--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
font-size:15px;line-height:1.55;padding-bottom:86px}
.app-header{background:#fff;border-bottom:1px solid var(--line);padding:18px 18px 14px;position:sticky;top:0;z-index:30}
.app-header h1{margin:0;font-size:21px;letter-spacing:.02em}
.app-header .sub{margin:3px 0 0;color:var(--muted);font-size:13px}
.cd{display:inline-block;margin-top:9px;background:var(--accent-soft);color:var(--accent);
font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px}
main{max-width:640px;margin:0 auto;padding:0 14px}
.tab{display:none}.tab.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
/* date strip */
.date-strip{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 2px;
display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.date-strip::-webkit-scrollbar{display:none}
.ddot{flex:0 0 auto;width:52px;padding:7px 0 6px;border:1px solid var(--line);background:#fff;border-radius:12px;
text-align:center;cursor:pointer;color:var(--ink)}
.ddot .d1{font-size:11px;color:var(--muted)}.ddot .d2{font-size:16px;font-weight:700}
.ddot.cur{border-color:var(--accent);background:var(--accent-soft)}
.ddot.cur .d2{color:var(--accent)}
.ddot .tod{font-size:10px;color:var(--accent);font-weight:700}
/* day card */
.day{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
.day-head{padding:15px 16px 11px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.day-d{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.day-t{font-size:17px;font-weight:750;margin-top:2px}
.today-badge{flex:0 0 auto;background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.conflict{margin:12px 14px 0;background:var(--red-soft);border:1px solid #f3c4b3;color:var(--red);
font-size:13px;border-radius:12px;padding:9px 12px}
.timeline{padding:6px 16px 4px}
.ev{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);position:relative}
.ev:last-child{border-bottom:none}
.ev-time{flex:0 0 86px;font-size:12.5px;font-weight:700;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.ev-body{flex:1;min-width:0}
.ev-title{font-weight:650;font-size:14.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ev-detail{color:#5b564a;font-size:13px;margin-top:3px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-confirmed{background:var(--green-soft);color:var(--green)}
.b-pending{background:var(--amber-soft);color:var(--amber)}
.b-planned{background:var(--gray-soft);color:var(--gray)}
.navbtn{flex:0 0 auto;align-self:center;font-size:12.5px;font-weight:700;color:var(--accent);
border:1px solid var(--accent);border-radius:999px;padding:6px 12px;text-decoration:none;background:#fff}
.day-more{padding:0 16px 6px}
details{border-top:1px dashed var(--line);padding:9px 0}
details summary{cursor:pointer;font-size:13.5px;font-weight:650;color:#4a4438;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"＋ ";color:var(--accent);font-weight:800}
details[open] summary::before{content:"－ "}
details .dtext{font-size:13.5px;color:#5b564a;margin-top:7px;white-space:pre-wrap}
.route-btn{display:block;margin:4px 16px 16px;text-align:center;background:var(--ink);color:#fff;
font-weight:700;font-size:14px;padding:11px;border-radius:12px;text-decoration:none}
/* todo */
.todo-head{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:15px 16px;margin:14px 0}
.todo-head .t{font-weight:750;font-size:16px}
.pbar{height:9px;background:var(--gray-soft);border-radius:99px;margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f59e0b);border-radius:99px;transition:width .3s}
.pnum{font-size:12.5px;color:var(--muted);margin-top:6px}
.titem{display:flex;gap:11px;align-items:flex-start;background:#fff;border-radius:14px;box-shadow:var(--shadow);
padding:12px 14px;margin:9px 0;cursor:pointer}
.titem input{appearance:none;-webkit-appearance:none;width:21px;height:21px;border:2px solid #cfc8b8;border-radius:7px;
margin:1px 0 0;flex:0 0 auto;cursor:pointer;position:relative;background:#fff}
.titem input:checked{background:var(--green);border-color:var(--green)}
.titem input:checked::after{content:"✓";color:#fff;font-size:14px;font-weight:800;position:absolute;left:3px;top:-1px}
.titem .tt{flex:1;font-size:14px}
.titem.done .tt{text-decoration:line-through;color:var(--muted)}
.ttag{flex:0 0 auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gray-soft);color:var(--gray)}
.ttag.pre{background:#e8eefc;color:#2f5fc0}
.tsec{font-size:13px;font-weight:750;color:var(--muted);margin:16px 2px 4px}
/* booking */
.bk{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin:10px 0}
.bk .r{font-size:12px;color:var(--muted);font-weight:700}
.bk .n{font-size:16px;font-weight:750;margin:2px 0}
.bk .d{font-size:13.5px;color:#5b564a;margin-top:5px}
.bk .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.leg{border-top:1px dashed var(--line);padding:9px 0 3px;font-size:13.5px}
.leg:last-child{padding-bottom:0}
.leg .lt{display:flex;justify-content:space-between;font-weight:650}
.leg .lm{color:var(--muted);font-size:12.5px}
h2.sec{font-size:16px;margin:20px 2px 4px}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);
backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;
padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;border:none;background:none;font-size:13.5px;font-weight:650;color:var(--muted);
padding:9px 0;border-radius:12px;cursor:pointer;font-family:inherit}
.tabbar button.active{color:var(--accent);background:var(--accent-soft)}
.cnt{background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;margin-left:4px}
.ver{position:fixed;top:8px;right:10px;z-index:50;font-size:10.5px;color:#fff;background:#00000055;
padding:3px 9px;border-radius:999px}
.empty{color:var(--muted);text-align:center;padding:26px 0;font-size:14px}
</style>
</head>
<body>
<div class="ver">v2 实验版</div>
<header class="app-header">
  <h1>湾区之行</h1>
  <p class="sub">9/25 – 10/10 · 旧金山湾区 / Yosemite / 西雅图 / 东京</p>
  <span class="cd" id="countdown">…</span>
</header>
<main>
  <section id="tab-trip" class="tab active">
    <div class="date-strip" id="dateStrip"></div>
    <div id="dayCards"></div>
  </section>
  <section id="tab-todo" class="tab">
    <div class="todo-head">
      <div class="t">行前待办</div>
      <div class="pbar"><i id="pfill" style="width:0"></i></div>
      <div class="pnum" id="pnum"></div>
    </div>
    <div class="tsec">未完成</div>
    <div id="todoOpen"></div>
    <div class="tsec">已完成</div>
    <div id="todoDone"></div>
  </section>
  <section id="tab-book" class="tab">
    <h2 class="sec">航班</h2><div id="flightCards"></div>
    <h2 class="sec">住宿</h2><div id="hotelCards"></div>
    <h2 class="sec">租车</h2><div id="rentalCards"></div>
    <div style="height:10px"></div>
  </section>
</main>
<nav class="tabbar">
  <button data-tab="trip" class="active">🧭 行程</button>
  <button data-tab="todo">✅ 待办<span class="cnt" id="todoBadge"></span></button>
  <button data-tab="book">🎫 预订</button>
</nav>

/* ---------- status & conflicts ---------- */
function statusOf(t){
  t=t||'';
  if(/待补|待定|待确认|待协调|待核实|待重排|待查|TBD/.test(t))return['pending','待定'];
  if(/已确认|已批准|已预订|已报名|已获|已延租|已办妥|已取消/.test(t))return['confirmed','已确认'];
  return['planned','计划中'];
}
function toMin(h,m){return +h*60 + +m;}
function parseRange(t){
  t=t||'';
  let m=t.match(/(\d{1,2}):(\d{2})\s*[–—-]\s*(\d{1,2}):(\d{2})/);
  if(m)return[toMin(m[1],m[2]),toMin(m[3],m[4])];
  m=t.match(/(\d{1,2}):(\d{2})/);
  if(m)return[toMin(m[1],m[2]),toMin(m[1],m[2])]; /* 单时间点视为零时长 */
  return null;
}
function findConflicts(items){
  const rs=items.map((it,i)=>({i,r:parseRange(it[0]),t:it[1]})).filter(x=>x.r);
  const out=[];
  for(let a=0;a<rs.length;a++)for(let b=a+1;b<rs.length;b++){
    const A=rs[a],B=rs[b];
    if(A.r[0]<B.r[1]&&B.r[0]<A.r[1])out.push('「'+A.t+'」与「'+B.t+'」时间重叠');
  }
  return out;
}
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---------- trip tab ---------- */
(function(){

    '<button class="ddot'+(i===curIdx?' cur':'')+'" data-i="'+i+'">'+

    document.getElementById('day-'+b.dataset.i).scrollIntoView({behavior:'smooth',block:'start'});
  }));

  const wrap=document.getElementById('dayCards');
  wrap.innerHTML=DAYS.map((d,i)=>{
    const items=(d.sched&&d.sched.items)||[];
    const conf=findConflicts(items);
    const dayPending=statusOf((d.note||'')+' '+(d.plan||'')+' '+(d.t||''))[0]==='pending';
    const evs=items.map(it=>{
      const[cls,label]=statusOf(it[1]+' '+it[2]);

        (it[2]?'<div class="ev-detail">'+esc(it[2])+'</div>':'')+'</div>'+
        '<a class="navbtn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+q+'">导航</a></div>';
    }).join('');
    const more=[];
    if(d.plan)more.push('<details><summary>今日计划</summary><div class="dtext">'+esc(d.plan)+'</div></details>');
    if(d.note)more.push('<details><summary>备注</summary><div class="dtext">'+esc(d.note)+'</div></details>');
    if(d.cost||d.time)more.push('<details><summary>时间 / 花费</summary><div class="dtext">'+esc([d.time,d.cost].filter(Boolean).join('\n'))+'</div></details>');
    return '<article class="day" id="day-'+i+'">'+
      '<div class="day-head"><div><div class="day-d">'+esc(d.d||'')+'</div>'+
      '<div class="day-t">'+esc(d.t||'')+'</div></div>'+
      '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">'+
      (i===curIdx?'<span class="today-badge">今天</span>':'')+
      (dayPending?'<span class="badge b-pending">有待定</span>':'')+'</div></div>'+
      (conf.length?'<div class="conflict">⚠️ '+conf.map(esc).join('<br>⚠️ ')+'</div>':'')+
      (evs?'<div class="timeline">'+evs+'</div>':'<div class="empty">本日暂无细化日程</div>')+
      (more.length?'<div class="day-more">'+more.join('')+'</div>':'')+
      (d.map?'<a class="route-btn" target="_blank" rel="noopener" href="'+esc(d.map)+'">🗺 今日路线导航</a>':'')+
      '</article>';
  }).join('');
  setTimeout(()=>{
    const el=document.getElementById('day-'+curIdx);
    if(el)el.scrollIntoView({block:'start'});
  },60);
})();

/* ---------- todo tab ---------- */
const LS='baytrip_todos_v2';
let todos;
try{todos=JSON.parse(localStorage.getItem(LS))||null;}catch(e){todos=null;}
if(!Array.isArray(todos)||!todos.length)todos=TODOS_SEED.map((x,i)=>({id:i,t:x.t,done:!!x.done}));
function todoTag(t){return /护照|机票|EVUS|eSIM|漫游|保险|插头|预订|出票|截图|备份|现金|银行卡|确认页/.test(t)?['pre','行前']:['mid','行中'];}
function renderTodos(){
  const open=document.getElementById('todoOpen'),done=document.getElementById('todoDone');
  const mk=x=>{
    const[cls,label]=todoTag(x.t);
    return '<label class="titem'+(x.done?' done':'')+'"><input type="checkbox" data-id="'+x.id+'"'+(x.done?' checked':'')+'>'+
      '<span class="tt">'+esc(x.t)+'</span><span class="ttag '+cls+'">'+label+'</span></label>';
  };
  const o=todos.filter(x=>!x.done),d=todos.filter(x=>x.done);
  open.innerHTML=o.length?o.map(mk).join(''):'<div class="empty">🎉 全部完成</div>';
  done.innerHTML=d.length?d.map(mk).join(''):'<div class="empty">暂无</div>';
  const pct=Math.round(d.length/todos.length*100);
  document.getElementById('pfill').style.width=pct+'%';
  document.getElementById('pnum').textContent='已完成 '+d.length+' / '+todos.length+'（'+pct+'%）';
  const badge=document.getElementById('todoBadge');
  badge.textContent=o.length; badge.style.display=o.length?'':'none';
  document.querySelectorAll('.titem input').forEach(c=>c.addEventListener('change',()=>{
    const it=todos.find(x=>x.id==c.dataset.id); if(it)it.done=c.checked;
    try{localStorage.setItem(LS,JSON.stringify(todos));}catch(e){}
    renderTodos();
  }));
}
renderTodos();
